name: scale
description: "Scale — anota tus canciones, detecta acordes y tonalidad desde MIDI."
publish_to: 'none'

version: 0.2.1+3

environment:
  sdk: ^3.12.2

dependencies:
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_inappwebview_platform_interface: 1.3.0+1
  flutter_inappwebview_windows: 0.6.0
  flutter_midi_command: ^1.4.0
  http: ^1.6.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  record: ^7.1.2
  scale_core:
    path: ../packages/scale_core
  webview_flutter: 4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Visor de partituras: Verovio (LGPL-3.0, ver THIRD_PARTY.txt) en un WebView.
    - assets/score_viewer/

  fonts:
    # Bravura (Steinberg, SIL Open Font License 1.1): glifos SMuFL para el pentagrama.
    - family: Bravura
      fonts:
        - asset: assets/fonts/Bravura.otf
